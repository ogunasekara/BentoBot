bentobot_odom:
  ros__parameters:
    process_noise_x: 0.01
    process_noise_y: 0.01
    process_noise_th: 0.09
    process_noise_v: 0.01
    process_noise_w: 0.09
    measurement_noise_odom_v: 0.01
    measurement_noise_odom_w: 0.01
    measurement_noise_imu_w: 0.01

# Joystick mapping. The web UI's calibration page changes these at runtime
# and saves one profile per controller; these are the defaults at startup.
bentobot_teleop:
  ros__parameters:
    axis_linear: 1
    axis_angular: 2
    scale_linear: 1.0
    scale_angular: 10.0
    invert_linear: false
    invert_angular: false
    deadzone: 0.0
    joy_timeout: 0.5
