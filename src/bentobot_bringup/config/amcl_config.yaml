# nav2_amcl (Foxy 0.4.x) for localization.launch.py. Based on nav2_bringup's
# nav2_params.yaml, tuned for the LD06 (12 m range, 450 beams after resampling)
# and a small diff-drive robot.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: differential
    tf_broadcast: true
    transform_tolerance: 1.0

    # motion model noise (odometry from the EKF is fairly good)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # laser model
    laser_model_type: likelihood_field
    laser_min_range: 0.05
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # particle filter (kept small for the Jetson Nano)
    min_particles: 300
    max_particles: 1500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_a: 0.2
    update_min_d: 0.1

    # the web UI sets the initial pose on /initialpose
    set_initial_pose: false
    save_pose_rate: 0.5
